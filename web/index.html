<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven Wellness - Bridging Symptom Tracking & Community</title>
    
    <!-- Bootstrap 5.3.0 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary-color: #d97706;
            --primary-dark: #b45309;
            --primary-light: #f59e0b;
            --secondary-color: #fbbf24;
            --accent-color: #84cc16;
            --accent-dark: #65a30d;
            --warm-neutral: #fef7ed;
            --cool-neutral: #fef3c7;
            --text-dark: #451a03;
            --text-muted: #92400e;
            --text-light: #a16207;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #451a03 0%, #78350f 50%, #92400e 100%);
            color: #fef3c7;
            min-height: 100vh;
        }
        
        .hero-gradient {
            background: linear-gradient(135deg, #b45309 0%, #d97706 50%, #f59e0b 100%);
            min-height: 40vh;
        }
        
        .feature-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 15px;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.2);
        }
        
        .sidebar {
            background: white;
            min-height: 100vh;
            border-right: 1px solid var(--secondary-color);
            width: 250px;
        }
        
        .main-content {
            flex: 1;
            background: linear-gradient(135deg, #451a03 0%, #78350f 50%, #92400e 100%);
            min-height: 100vh;
        }
        
        .nav-link {
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 0;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover, .nav-link.active {
            background: var(--primary-color);
            color: white;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-primary {
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 500;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-outline-primary:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .pain-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .pain-1 { background: var(--accent-color); }
        .pain-2 { background: #f06292; }
        .pain-3 { background: var(--primary-color); }
        .pain-4 { background: var(--primary-dark); }
        .pain-5 { background: #880e4f; }
        
        .pain-low { background: var(--accent-color); }
        .pain-moderate { background: #f06292; }
        .pain-high { background: var(--primary-dark); }
        
        .chat-message {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px 16px;
            margin: 8px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: #fef3c7;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .chat-message.own {
            background: var(--primary-color);
            color: white;
            margin-left: 20%;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
        
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
        
        /* Cursor Particle Effects */
        #cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }
        
        .cursor-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(45deg, #5d0a33, #7a0e42);
            border-radius: 50%;
            animation: particle-fade 1s ease-out forwards;
        }
        
        @keyframes particle-fade {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.3) translateY(-20px);
            }
        }
        
        /* Enhanced UI Animations */
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(93, 10, 51, 0.15);
        }
        
        .btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(93, 10, 51, 0.3);
        }
        
        /* Floating Animation */
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        /* Pulse Animation */
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #5d0a33, #7a0e42, #8e0e4f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Glow Effect */
        .glow {
            box-shadow: 0 0 20px rgba(93, 10, 51, 0.3);
        }
        
        /* Smooth Transitions */
        * {
            transition: all 0.3s ease;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #5d0a33, #7a0e42);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #7a0e42, #8e0e4f);
        }
    </style>
</head>
<body>
    <!-- Main App Container -->
    <div id="app" class="view-container">
        <!-- Content will be dynamically loaded here -->
    </div>

    <!-- Toast Container -->
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Haven Wellness</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
            <!-- Toast message will be inserted here -->
        </div>
    </div>

    <!-- Bootstrap 5.3.0 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Cursor Trail Container -->
    <div id="cursor-trail"></div>

    <!-- Application Scripts -->
    <script src="./js/api.js?v=1"></script>
    <script src="./js/auth.js?v=1"></script>
    <script src="./js/views.js?v=1"></script>
    <script src="./js/app.js?v=1"></script>
    <script src="./js/symptoms.js?v=1"></script>
    <script src="./js/groups.js?v=1"></script>
    <script src="./js/analytics.js?v=1"></script>
    <script src="./js/pairing.js?v=1"></script>
    
    <!-- Enhanced UI Effects Script -->
    <script>
        // Cursor Particle Effects
        class CursorTrail {
            constructor() {
                this.trail = document.getElementById('cursor-trail');
                this.particles = [];
                this.mouseX = 0;
                this.mouseY = 0;
                this.init();
            }
            
            init() {
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                    this.createParticle();
                });
            }
            
            createParticle() {
                const particle = document.createElement('div');
                particle.className = 'cursor-particle';
                particle.style.left = this.mouseX + 'px';
                particle.style.top = this.mouseY + 'px';
                
                // Randomize particle properties
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Random colors from our theme
                const colors = ['#d97706', '#f59e0b', '#fbbf24'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.background = randomColor;
                
                this.trail.appendChild(particle);
                
                // Remove particle after animation
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 1000);
            }
        }
        
        // Enhanced UI Interactions
        class EnhancedUI {
            constructor() {
                this.init();
            }
            
            init() {
                // Add floating animation to cards
                this.addFloatingEffects();
                
                // Add pulse animation to important elements
                this.addPulseEffects();
                
                // Add gradient text effects
                this.addGradientText();
                
                // Add glow effects on hover
                this.addGlowEffects();
                
                // Add smooth page transitions
                this.addPageTransitions();
            }
            
            addFloatingEffects() {
                const cards = document.querySelectorAll('.card');
                cards.forEach((card, index) => {
                    card.classList.add('floating');
                    card.style.animationDelay = `${index * 0.1}s`;
                });
            }
            
            addPulseEffects() {
                const buttons = document.querySelectorAll('.btn-primary');
                buttons.forEach(btn => {
                    btn.classList.add('pulse');
                });
            }
            
            addGradientText() {
                const headings = document.querySelectorAll('h1, h2, h3');
                headings.forEach(heading => {
                    if (heading.textContent.includes('Haven Wellness') || 
                        heading.textContent.includes('Welcome')) {
                        heading.classList.add('gradient-text');
                    }
                });
            }
            
            addGlowEffects() {
                const interactiveElements = document.querySelectorAll('.btn, .card, .nav-link');
                interactiveElements.forEach(element => {
                    element.addEventListener('mouseenter', () => {
                        element.classList.add('glow');
                    });
                    element.addEventListener('mouseleave', () => {
                        element.classList.remove('glow');
                    });
                });
            }
            
            addPageTransitions() {
                // Add smooth transitions between views
                const app = document.getElementById('app');
                if (app) {
                    app.style.transition = 'opacity 0.3s ease-in-out';
                }
            }
        }
        
        // Initialize effects when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new CursorTrail();
            new EnhancedUI();
        });
        
        // Add dynamic background particles
        class BackgroundParticles {
            constructor() {
                this.canvas = null;
                this.ctx = null;
                this.particles = [];
                this.init();
            }
            
            init() {
                this.createCanvas();
                this.createParticles();
                this.animate();
            }
            
            createCanvas() {
                this.canvas = document.createElement('canvas');
                this.canvas.style.position = 'fixed';
                this.canvas.style.top = '0';
                this.canvas.style.left = '0';
                this.canvas.style.width = '100%';
                this.canvas.style.height = '100%';
                this.canvas.style.pointerEvents = 'none';
                this.canvas.style.zIndex = '-1';
                this.canvas.style.opacity = '0.1';
                document.body.appendChild(this.canvas);
                
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            createParticles() {
                const particleCount = 50;
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 3 + 1,
                        opacity: Math.random() * 0.5 + 0.1
                    });
                }
            }
            
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.particles.forEach(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.vy *= -1;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(217, 119, 6, ${particle.opacity})`;
                    this.ctx.fill();
                });
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // Initialize background particles
        new BackgroundParticles();
    </script>
</body>
</html>
